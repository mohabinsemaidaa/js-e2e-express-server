# Node.js
# Build a general Node.js project with npm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript


trigger:
  branches:
    include:
      - main
      - feature/*

pool:
  vmImage: ubuntu-latest

steps:
  - task: UseNode@1
    displayName: 'Install Node.js'
    inputs:
      version: '20.x'
  - script: npm install
    displayName: 'Install dependencies'
  - script: node --check src/server.js
    displayName: 'Check JavaScript syntax'
  - script: |
      npm run build
      npm test
    displayName: 'Build and test application'
  - task: ArchiveFiles@2
    displayName: 'Archive application files'
    inputs:
      rootFolderOrFile: '$(Build.SourcesDirectory)'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/application.zip'
      replaceExistingArchive: true
  - task: PublishPipelineArtifact@1
    displayName: 'Publish application artifact'
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/application.zip'
      artifact: 'application'
      publishLocation: 'pipeline'

