
# Multistage CI/CD Pipeline
# Build, Test, Package, Approve, Deploy

trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:
- stage: Build
  displayName: 'Build'
  jobs:
  - job: BuildApp
    displayName: 'Build Node.js application'
    steps:
    - task: UseNode@1
      displayName: 'Install Node.js'
      inputs:
        version: '20.x'
    - script: npm install
      displayName: 'Install dependencies'
    - script: node --check src/server.js
      displayName: 'Check JavaScript syntax'
    - script: |
        npm run build
        npm test
      displayName: 'Build and test application'
    - task: ArchiveFiles@2
      displayName: 'Archive application files'
      inputs:
        rootFolderOrFile: '$(Build.SourcesDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/application.zip'
        replaceExistingArchive: true
    - task: PublishPipelineArtifact@1
      displayName: 'Publish application artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/application.zip'
        artifact: 'application'
        publishLocation: 'pipeline'
- stage: Deploy
  displayName: 'Deploy'
  dependsOn: Build
  condition: succeeded()
  jobs:
  
  - deployment: DeployApp
    displayName: 'Deploy Node.js application'
    environment: 'Production'
    strategy:
      runOnce:
        deploy:
          steps:

          - download: current
            artifact: application
          - task: AzureWebApp@1
            displayName: 'Deploy to Azure App Service'
            inputs:
              azureSubscription: 'azure-student-connection'
              appType: 'webAppLinux'
              appName: 'express-course-app-2026'
              package: '$(Pipeline.Workspace)/application/application.zip'
              runtimeStack: 'NODE|24-lts'
